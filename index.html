<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sebo - Sistema de Recibos</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
}

header {
    background: #ff8800;
    color: #fff;
    padding: 15px;
    text-align: center;
}

.container {
    max-width: 800px;
    margin: 20px auto;
    padding: 10px;
}

.card {
    background: #fff;
    border-radius: 8px;
    padding: 15px;
    margin-bottom: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

h2 { margin-top: 0; font-size: 18px; }

.form-group { margin-bottom: 10px; }

input, select {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
}

button {
    width: 100%;
    padding: 10px;
    background: #ff8800;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 5px;
}

button:hover { background: #333; }

.lista {
    max-height: 220px;
    overflow-y: auto;
}

.item {
    border-bottom: 1px solid #eee;
    padding: 8px 0;
    font-size: 14px;
}

.usado { color: red; font-weight: bold; }
.disponivel { color: green; font-weight: bold; }

/* impressão térmica */
@media print {
    @page {
        size: 80mm auto;
        margin: 0;
    }

    html, body {
        width: 80mm;
        height: auto;
        margin: 0;
        padding: 0;
    }

    body * {
        visibility: hidden;
    }

    #recibo, #recibo * {
        visibility: visible;
    }

    #recibo {
        position: absolute;
        top: 0;
        left: 0;
        width: 72mm;
        padding: 5px;
        font-family: monospace;
        font-size: 12px;
        line-height: 1.1;

        /* 🔥 ESSENCIAL PRA NÃO QUEBRAR */
        page-break-before: avoid;
        page-break-after: avoid;
        page-break-inside: avoid;
        break-inside: avoid;
    }
}

#recibo { display: none; }

a {
    border: solid white 2px;
    text-decoration: none;
    border-radius: 20px;
    background-color: rgba(255, 77, 6, 0.521);
    color: aliceblue;
}

#itensLista {
    font-size: 14px;
    margin-top: 10px;
}
</style>
</head>

<body>

<header>
    <h1>Sistema de Recibos</h1>
    <a href="https://www.loopweb.company/">site feito por loopweb</a>
</header>

<div class="container">

<div class="card">
<h2>Gerar Recibo</h2>

<div class="form-group">
<input type="text" id="funcionario" placeholder="Funcionário">
</div>

<div class="form-group">
<select id="loja">
<option value="Loja sinimbu">Loja sinimbu</option>
<option value="Loja julio">Loja julio</option>
</select>
</div>

<!-- ITENS -->
<div class="form-group">
<input type="text" id="nomeItem" placeholder="Nome do item">
</div>

<div class="form-group">
<input type="number" id="valorItem" placeholder="Valor do item">
</div>

<button onclick="adicionarItem()">Adicionar Item</button>

<div id="itensLista"></div>

<h3>Total: R$ <span id="total">0.00</span></h3>

<button onclick="gerarRecibo()">Gerar e Imprimir</button>
</div>

<div class="card">
<h2>Verificar Vale</h2>

<div class="form-group">
<input type="text" id="codigoBusca" placeholder="Código ou scanner">
</div>

<button onclick="verificarVale()">Verificar</button>
</div>

<div class="card">
<h2>Histórico</h2>
<div class="lista" id="lista"></div>
</div>

</div>

<div id="recibo"></div>

<script>
let itens = [];

function gerarID() {
    return "V" + Date.now();
}

function salvar(vales) {
    localStorage.setItem("vales", JSON.stringify(vales));
}

function carregar() {
    return JSON.parse(localStorage.getItem("vales")) || [];
}

function adicionarItem() {
    const nome = document.getElementById("nomeItem").value;
    const valor = parseFloat(document.getElementById("valorItem").value);

    if (!nome || isNaN(valor)) {
        alert("Preencha item e valor");
        return;
    }

    itens.push({ nome, valor });

    document.getElementById("nomeItem").value = "";
    document.getElementById("valorItem").value = "";

    atualizarLista();
}

function atualizarLista() {
    const lista = document.getElementById("itensLista");
    const totalSpan = document.getElementById("total");

    lista.innerHTML = "";
    let total = 0;

    itens.forEach(i => {
        total += i.valor;
        lista.innerHTML += `${i.nome} - R$ ${i.valor.toFixed(2)}<br>`;
    });

    totalSpan.innerText = total.toFixed(2);
}

function gerarRecibo() {
    const funcionario = document.getElementById("funcionario").value;
    const loja = document.getElementById("loja").value;

    if (!funcionario || itens.length === 0) {
        alert("Preencha os dados e adicione itens");
        return;
    }

    const valor = itens.reduce((soma, i) => soma + i.valor, 0);

    const vale = {
        id: gerarID(),
        funcionario,
        loja,
        valor,
        itens: [...itens],
        usado: false,
        data: new Date().toLocaleString()
    };

    const vales = carregar();
    vales.push(vale);
    salvar(vales);

    imprimir(vale);
    listar();

    // limpar tudo
    document.getElementById("funcionario").value = "";
    itens = [];
    atualizarLista();
}

function imprimir(v) {
    const r = document.getElementById("recibo");
    r.style.display = "block";

    let itensHTML = "";
    v.itens.forEach(i => {
        itensHTML += `${i.nome} - R$ ${i.valor.toFixed(2)}<br>`;
    });

    r.innerHTML = `
<center>
SEBO<br>
${v.loja}<br>
----------------<br>
</center>

Func: ${v.funcionario}<br>

${itensHTML}

----------------<br>
Total: R$ ${v.valor.toFixed(2)}<br>
${v.data}<br>
Cod: ${v.id}<br>

<svg id="barcode"></svg>

Ass
<br>----------------<br>

`;

    JsBarcode("#barcode", v.id, {
        format: "CODE128",
        width: 2,
        height: 40,
        displayValue: false
    });

    window.print();
    r.style.display = "none";
}

function verificarVale() {
    const codigo = document.getElementById("codigoBusca").value;
    const vales = carregar();

    const vale = vales.find(v => v.id === codigo);

    if (!vale) return alert("Vale não encontrado");

    if (vale.usado) {
        alert("Vale já utilizado");
    } else {
        if (confirm("Vale válido. Marcar como usado?")) {
            vale.usado = true;
            salvar(vales);
            listar();
        }
    }
}

function listar() {
    const lista = document.getElementById("lista");
    const vales = carregar();

    lista.innerHTML = "";

    vales.slice().reverse().forEach(v => {
        const div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
<b>${v.id}</b><br>
R$ ${v.valor.toFixed(2)} - ${v.loja}<br>
<span class="${v.usado ? 'usado' : 'disponivel'}">
${v.usado ? 'USADO' : 'DISPONÍVEL'}
</span>
`;

        lista.appendChild(div);
    });
}

listar();
</script>

</body>
</html>
